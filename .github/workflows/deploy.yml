name: deploy

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    # available images: https://github.com/actions/runner-images#available-images
    runs-on: ubuntu-latest
    steps:
    - name: Checkout 🛎️
      uses: actions/checkout@v3
    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2'
        bundler-cache: true
    - name: Update _config.yml ⚙️
      uses: fjogeleit/yaml-update-action@v0.13.1
      with:
        commitChange: false
        valueFile: '_config.yml'
        propertyPath: 'giscus.repo'
        value: ${{ github.repository }}
    - name: Install and Build 🔧
      run: |
        sudo apt-get update && sudo apt-get install -y imagemagick
        npm install -g purgecss
        export JEKYLL_ENV=production
        bundle exec jekyll build
        purgecss -c purgecss.config.js
    - name: Add lowercase JVT URL
      run: |
        test -f _site/JVT/index.html
        mkdir _site/jvt
        cat > _site/jvt/index.html <<'HTML'
        <!doctype html>
        <html lang="en">
        <head>
          <meta charset="utf-8">
          <title>JVT</title>
          <link rel="canonical" href="https://zhoutimemachine.github.io/JVT/">
          <meta http-equiv="refresh" content="0; url=../JVT/">
        </head>
        <body>
          <p><a href="../JVT/">Open the JVT project page</a></p>
        </body>
        </html>
        HTML
    - name: Deploy 🚀
      if: github.event_name != 'pull_request'
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: _site

